name: Validate JSON
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all JSON files
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            jq empty "$f"
          done
